<svg xmlns="http://www.w3.org/2000/svg" width="700" height="110" viewBox="0 0 700 110">
<style>
.walk{animation:walk 14s linear infinite}
.bob{animation:bob .5s ease-in-out infinite}
.wag{animation:wag .3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 100%}
.l1{animation:step .5s ease-in-out infinite}
.l2{animation:step .5s ease-in-out infinite;animation-delay:.25s}
@keyframes walk{0%{transform:translateX(-100px)}100%{transform:translateX(720px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes wag{0%{transform:rotate(-18deg)}100%{transform:rotate(18deg)}}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
<line x1="0" y1="92" x2="700" y2="92" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 8" opacity=".5"/>
<g transform="translate(0,30)"><g class="walk">
<g class="bob">
<g class="wag"><rect x="0" y="5" width="10" height="5" fill="#d9a066"/><rect x="5" y="10" width="10" height="5" fill="#d9a066"/><rect x="5" y="15" width="10" height="5" fill="#d9a066"/></g>
<rect x="50" y="0" width="25" height="5" fill="#d9a066"/>
<rect x="45" y="5" width="35" height="5" fill="#d9a066"/>
<rect x="45" y="10" width="35" height="5" fill="#d9a066"/>
<rect x="45" y="15" width="30" height="5" fill="#d9a066"/>
<rect x="50" y="20" width="20" height="5" fill="#d9a066"/>
<rect x="70" y="10" width="10" height="5" fill="#f3e0c0"/>
<rect x="70" y="15" width="10" height="5" fill="#f3e0c0"/>
<rect x="75" y="10" width="5" height="5" fill="#222"/>
<rect x="70" y="20" width="5" height="5" fill="#f08aa0"/>
<rect x="45" y="0" width="10" height="5" fill="#8a5a2b"/>
<rect x="40" y="5" width="10" height="5" fill="#8a5a2b"/>
<rect x="40" y="10" width="10" height="5" fill="#8a5a2b"/>
<rect x="45" y="15" width="5" height="5" fill="#8a5a2b"/>
<rect x="60" y="5" width="5" height="5" fill="#111"/>
<rect x="10" y="20" width="45" height="5" fill="#d9a066"/>
<rect x="10" y="25" width="45" height="5" fill="#d9a066"/>
<rect x="10" y="30" width="45" height="5" fill="#d9a066"/>
<rect x="15" y="35" width="40" height="5" fill="#f3e0c0"/>
<rect x="20" y="25" width="15" height="5" fill="#8a5a2b"/>
<rect x="20" y="20" width="10" height="5" fill="#8a5a2b"/>
</g>
<g class="l1"><rect x="15" y="40" width="10" height="5" fill="#d9a066"/><rect x="15" y="45" width="10" height="5" fill="#d9a066"/><rect x="15" y="50" width="10" height="5" fill="#f3e0c0"/></g><g class="l2"><rect x="25" y="40" width="10" height="5" fill="#d9a066"/><rect x="25" y="45" width="10" height="5" fill="#d9a066"/><rect x="25" y="50" width="10" height="5" fill="#f3e0c0"/></g><g class="l2"><rect x="45" y="40" width="10" height="5" fill="#d9a066"/><rect x="45" y="45" width="10" height="5" fill="#d9a066"/><rect x="45" y="50" width="10" height="5" fill="#f3e0c0"/></g><g class="l1"><rect x="55" y="40" width="10" height="5" fill="#d9a066"/><rect x="55" y="45" width="10" height="5" fill="#d9a066"/><rect x="55" y="50" width="10" height="5" fill="#f3e0c0"/></g>
</g></g>
</svg>